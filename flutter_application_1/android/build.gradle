buildscript {
    ext {
        compileSdkVersion = 34    // Android 15
        targetSdkVersion = 34
        minSdkVersion = 21        // Keep your minimum
        ndkVersion = "25.2.9519653" // NDK r25b or higher
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.3.0" // latest stable
    }
}